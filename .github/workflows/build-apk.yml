name: Compilador Automatico de APK

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalando Dependencias
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilando Interfaz Web
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Inyectando Estructura Android Nativa
        run: |
          npx cap add android || true
          npx cap sync
          # Parche maestro: Elevar Gradle a 8.5 para evitar el bloqueo de Bouncy Castle
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-8.2.1-all.zip/gradle-8.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Configurando Motor Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensamblando Archivo APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publicar Archivo APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: Killer-App-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk
