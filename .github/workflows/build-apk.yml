name: Compilador Automatico de APK

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalando Dependencias
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilando Interfaz Web
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Inyectando Estructura Android Nativa
        run: |
          npx cap add android || true
          npx cap sync
          
          # Parche Maestro 1: Elevar el SDK a API 35 (Android 15) para desbloquear VANILLA_ICE_CREAM
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/compileSdkVersion\s*=\s*[0-9]+/compileSdkVersion = 35/g' android/variables.gradle
            sed -i -E 's/targetSdkVersion\s*=\s*[0-9]+/targetSdkVersion = 35/g' android/variables.gradle
          fi
          
          # Parche Maestro 2: Forzar Gradle 8.5 para evitar bloqueos criptográficos
          mkdir -p android/gradle/wrapper
          cat << 'WEOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WEOF

      - name: Configurando Motor Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensamblando Archivo APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publicar Archivo APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: Killer-App-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk
