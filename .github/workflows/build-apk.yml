name: Compilador Automatico de APK

on:
  push:
    branches: [ main, master, principal ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalando Dependencias
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilando Interfaz Web
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Inyectando Estructura Android Nativa
        run: |
          npx cap add android || true
          npx cap sync
          
          # Parche 1: SDK 35
          sed -i -E 's/compileSdkVersion\s*=\s*[0-9]+/compileSdkVersion = 35/g' android/variables.gradle
          sed -i -E 's/targetSdkVersion\s*=\s*[0-9]+/targetSdkVersion = 35/g' android/variables.gradle
          
          # Parche 2: Gradle 8.5
          mkdir -p android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

          # Parche 3: Limpieza de Kotlin (Usando echo para evitar problemas de multilínea YAML)
          echo -e "\nsubprojects {\n    configurations.all {\n        resolutionStrategy {\n            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        }\n    }\n}" >> android/build.gradle

      - name: Configurando Motor Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensamblando Archivo APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publicar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Killer-App-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk
