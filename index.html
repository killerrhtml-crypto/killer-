<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Killer Automation v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d12; color: #e4e4e7; font-family: system-ui, sans-serif; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">
    <div id="view-login" class="max-w-md w-full mx-auto my-auto space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-amber-500">KILLER <span class="text-white text-xl font-light">AUTOMATION</span></h1>
            <p class="text-xs text-zinc-400">Control de Acceso y Captura de Viajes Nativos</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl space-y-4 shadow-xl">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">URL del Servidor API</label>
                <input id="login-url" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none text-amber-400 font-mono" placeholder="http://tu-servidor:3000">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">ID del Dispositivo</label>
                <input id="login-device" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none" placeholder="DEV-101">
            </div>
            <button id="btn-connect" class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3.5 rounded-xl text-sm uppercase mt-2">
                Conectar Sistema
            </button>
        </div>
    </div>
    <p class="text-[10px] text-center text-zinc-600 mt-4 font-mono">Killer Corp © 2026</p>
    <script>
        document.getElementById('login-url').value = window.location.origin;
        document.getElementById('btn-connect').addEventListener('click', () => alert('Conectando al ecosistema...'));
    </script>
</body>
</html>
